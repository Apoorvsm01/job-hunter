# Copy to config/lm_studio.yaml and point it at your LM Studio server's OpenAI-compatible
# API (LM Studio > Developer > Start Server; default port 1234). base_url must include the
# "/v1" suffix. Find your machine's LAN IP with `ipconfig getifaddr en0` (macOS Wi-Fi) or
# `hostname -I` (Linux) if LM Studio runs on a different machine on your network.
base_url: http://192.168.1.100:1234/v1

# The model identifier LM Studio reports for whatever you've loaded (check the server's
# own logs or GET {base_url}/models) — LM Studio ignores this if only one model is loaded,
# but the OpenAI-compatible API still requires the field to be present.
model: local-model

# Generous timeout: local inference on modest hardware can take well over a minute per job.
timeout_seconds: 180
temperature: 0.2

# Thinking mode, from the bake-off in docs/bakeoff/ (reasoning models spend ~90% of their time thinking):
#   off     (write it bare or quoted) = reasoning_effort "none": about 10x faster; the review prompt's judgments-first JSON keeps quality.
#   low     = only for models that list it (check LM Studio's model page); others silently fall back to on.
#   default = send nothing; the model keeps its own setting (usually full thinking).
# Pick the model and mode with `scripts/bakeoff_models.py` on your own hardware. A malformed answer is retried once.
reasoning: default

# Resume view: send the model a smaller, contact-free copy of the master resume (the file is never edited and the
# resume generator keeps the original). Drops the name/contact block and scrubs emails, phones and URLs; sections
# listed in compact_sections and entries whose title contains a compact_entry_terms word shrink to one line
# (title | employer | dates). Check it with `scripts/bakeoff_models.py --resume-view` vs `--no-resume-view`.
resume_view:
  enabled: false
  compact_sections: []        # e.g. ["student team", "invited talks"] (top-level headings, case-insensitive)
  compact_entry_terms: []     # e.g. ["intern"]
